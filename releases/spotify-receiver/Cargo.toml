[package]
name = "no5-spotify-connect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "No5 Spotify Connect receiver with local authenticated control and real progress events"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "with-libmdns"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
protobuf = "=3.7.2"
protobuf-json-mapping = "=3.7.2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect"] }

[features]
default = []
# Enable this only on the Debian/Raspberry Pi build host. macOS contract tests
# intentionally compile the receiver without an unavailable ALSA SDK.
alsa = ["librespot/alsa-backend"]

[dev-dependencies]
tempfile = "3.15"
tokio = { version = "1", features = ["test-util"] }

[patch.crates-io]
# A bounded, observation-only mixer notification replaces set_volume feedback.
librespot-connect = { path = "vendor/librespot-connect" }
