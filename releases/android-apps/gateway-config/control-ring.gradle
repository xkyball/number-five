abstract class PrepareNo5ControlRing extends org.gradle.api.DefaultTask {
    @org.gradle.api.tasks.InputFile abstract org.gradle.api.file.RegularFileProperty getPinFile()
    @org.gradle.api.tasks.Internal abstract org.gradle.api.file.DirectoryProperty getControllerRepository()
    @org.gradle.api.tasks.OutputDirectory abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()
    @org.gradle.api.tasks.TaskAction void prepare() {
        def pin = new groovy.json.JsonSlurper().parse(pinFile.get().asFile)
        def process = new ProcessBuilder('git', '-C', controllerRepository.get().asFile.absolutePath, 'show', "${pin.commit}:${pin.path}").start()
        def bytes = process.inputStream.readAllBytes()
        if (process.waitFor() != 0 || java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() != pin.sha256)
            throw new org.gradle.api.GradleException('Reviewed control ring source unavailable or changed')
        def destination = new File(outputDirectory.get().asFile, pin.destination)
        destination.parentFile.mkdirs(); destination.bytes = bytes
    }
}
def contract = buildscript.sourceFile.parentFile.canonicalFile
def prepare = tasks.register('prepareControlRing', PrepareNo5ControlRing) {
    pinFile.set(new File(contract, 'control-ring.json'))
    controllerRepository.set(new File(contract.parentFile.parentFile, 'no-android/projects/lumina-control'))
    outputDirectory.set(layout.buildDirectory.dir('generated/no5-control-ring'))
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.java.addGeneratedSourceDirectory(prepare) { task -> task.outputDirectory }
}
