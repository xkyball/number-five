[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "no5-pi-gateway"
version = "0.1.0"
description = "No5 app-facing Raspberry Pi V1 gateway for SONAR, HELM and AUDIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.4",
  "cryptography==50.0.2",
]

[project.scripts]
no5-pi-gateway = "no5_pi_gateway.__main__:main"
no5-raspotify-event-bridge = "no5_pi_gateway.audio:raspotify_event_main"
no5-gateway-header-hash-sync = "no5_pi_gateway.gateway_header_hash:main"

[project.optional-dependencies]
test = [
  "jsonschema>=4.18,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
no5_pi_gateway = ["*.html"]
