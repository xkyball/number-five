# Include only in the hostname-checked :443 browser server.
location = /simulator {
    return 308 /simulator/;
}
location = /simulator/ {
    limit_except GET { deny all; }
    root /usr/local/share/no5-gateway;
    try_files /simulator/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
location = /simulator/app.js {
    limit_except GET { deny all; }
    alias /usr/local/share/no5-gateway/simulator/app.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /simulator/app.css {
    limit_except GET { deny all; }
    alias /usr/local/share/no5-gateway/simulator/app.css;
    default_type text/css;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /simulator/api {
    if ($no5_gateway_authorized = 0) { return 401; }
    if ($request_method !~ ^(GET|POST)$) { return 405; }
    if ($no5_simulator_origin_ok = 0) { return 403; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8789/admin/v1/simulation;
    proxy_http_version 1.1;
    # Root-private, generated on the Pi from its existing local bearer.
    include /etc/no5-gateway-proxy/nginx-simulator-upstream-auth.conf;
    proxy_set_header X-No5-Gateway-Key "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
location ^~ /simulator/ {
    return 404;
}
