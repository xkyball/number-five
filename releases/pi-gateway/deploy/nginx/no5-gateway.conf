# Installed as /etc/nginx/sites-available/no5-gateway.  The secret-bearing
# map is generated locally in /etc/nginx/conf.d/no5-gateway-auth.conf and is
# intentionally not part of this repository.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name lysmarine.local;

    ssl_certificate /etc/no5-gateway-proxy/tls/server.crt;
    ssl_certificate_key /etc/no5-gateway-proxy/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:no5_gateway_tls:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Raw admin routes remain private. The separately approved :443 browser
    # route exposes only /simulator/api through the existing gateway key.
    location ^~ /admin/ {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location / {
        # This exact comparison uses the secret generated in the HTTP-level
        # map. The separate CamillaGUI listener on :443 deliberately has its
        # own cookie session boundary so a browser never exposes this key in a
        # URL, local storage or a long-lived frontend header.
        # A syntactically bounded N5T2 bearer may reach the loopback gateway;
        # the gateway performs the actual P-256, expiry, audience and scope
        # verification.  Nginx never treats bearer syntax as authorization.
        if ($no5_gateway_credential_present = 0) { return 401; }
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }
}

# Existing CamillaGUI is a full DSP configuration surface. Bind this listener
# only to the selected boat-LAN interfaces, keep its upstream on loopback and make
# browser access a short-lived, HTTPS-only gateway session. This server
# exposes Camilla sessions and the Gateway-key-protected simulator.
server {
    include /etc/no5-gateway-proxy/nginx-browser-listeners.conf;
    server_name lysmarine.local;

    ssl_certificate /etc/no5-gateway-proxy/tls/server.crt;
    ssl_certificate_key /etc/no5-gateway-proxy/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:no5_camillagui_tls:10m;
    ssl_session_timeout 10m;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The exact hostname protects the session's configured Origin boundary
    # from direct-IP or alternate-Host use of this address-bound listener.
    if ($no5_camillagui_host_ok = 0) { return 421; }

    include /etc/no5-gateway-proxy/nginx-simulator-locations.conf;

    location = /camilladsp {
        return 308 /camilladsp/;
    }

    location = /camilladsp/login {
        limit_except GET { deny all; }
        alias /usr/local/share/no5-gateway/camillagui-login.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location = /camilladsp/login.js {
        limit_except GET { deny all; }
        alias /usr/local/share/no5-gateway/camillagui-login.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location = /camilladsp/login.css {
        limit_except GET { deny all; }
        alias /usr/local/share/no5-gateway/camillagui-login.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
    }

    # Only the login page sends the existing gateway key. The body is proxied
    # to a loopback-only gateway route, is not logged by Nginx, and is reduced
    # immediately to a 15-minute signed HttpOnly cookie.
    location = /camilladsp/session {
        limit_except POST { deny all; }
        limit_req zone=no5_camillagui_login burst=2 nodelay;
        if ($no5_camillagui_unsafe_origin_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:8789/internal/camillagui/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-No5-Gateway-Key "";
        proxy_set_header Cookie "";
        proxy_buffering off;
    }

    location = /camilladsp/logout {
        limit_except POST { deny all; }
        if ($no5_camillagui_unsafe_origin_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:8789/internal/camillagui/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-No5-Gateway-Key "";
        proxy_buffering off;
    }

    # auth_request sends only the browser cookie to the loopback gateway. It
    # never forwards request bodies, the raw gateway key or GUI credentials.
    location = /__no5_camillagui_auth {
        internal;
        proxy_pass http://127.0.0.1:8789/internal/camillagui/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-No5-Gateway-Key "";
    }

    location @no5_camillagui_login {
        return 302 /camilladsp/login;
    }

    location ^~ /camilladsp/ {
        # CamillaGUI state changes are admitted only from the one HTTPS origin.
        # Read requests do not need Origin; Secure/SameSite cookie semantics
        # and browser CORS rules still prevent cross-site credential use.
        if ($no5_camillagui_unsafe_origin_ok = 0) { return 403; }
        auth_request /__no5_camillagui_auth;
        error_page 401 = @no5_camillagui_login;

        proxy_pass http://127.0.0.1:5005/;
        proxy_redirect http://127.0.0.1:5005/ /camilladsp/;
        proxy_redirect ~^/(.*)$ /camilladsp/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;

        # CamillaGUI currently emits root-relative /api/ calls. Keep it behind
        # the documented /camilladsp/ prefix instead of exposing a second
        # root-level API. Empty Accept-Encoding makes the substitution safe.
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
        sub_filter '"/api/' '"/camilladsp/api/';
        sub_filter '`/api/' '`/camilladsp/api/';
    }

    # Gateway-internal session paths must never be public, including through
    # a guessed URL on the browser listener.
    location ^~ /internal/ {
        return 404;
    }

    location / {
        return 404;
    }
}
