# HTTP-context maps/zones for the dedicated CamillaGUI browser listener.
# This file contains no secret and is safe to install alongside the existing
# generated no5-gateway-auth.conf map.
map $host $no5_camillagui_host_ok {
    default 0;
    lysmarine.local 1;
}

# Browser state-changing calls require the exact configured HTTPS Origin.
# Safe retrieval requests do not normally carry Origin and are allowed through
# to the short-lived Secure/SameSite session check.
map "$request_method:$http_origin" $no5_camillagui_unsafe_origin_ok {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    ~^(POST|PUT|PATCH|DELETE):https://lysmarine\.local$ 1;
}

# Login can verify an expensive key hash only a few times per minute per LAN
# client. It is deliberately separate from the existing gateway API limits.
limit_req_zone $binary_remote_addr zone=no5_camillagui_login:10m rate=5r/m;
