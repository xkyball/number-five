# Included in each HTTPS server; native clients omit Origin, browsers must match.
location = /__no5_gateway_auth {
    internal;
    proxy_pass http://127.0.0.1:8790/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-No5-Gateway-Key $http_x_no5_gateway_key;
    proxy_set_header X-No5-Gateway-Password $http_x_no5_gateway_password;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
}
location = /auth/v1/ca {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8790/ca;
    proxy_pass_request_headers off;
    proxy_buffering off;
}
location = /auth/v1/parameters {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8790/parameters;
    proxy_pass_request_headers off;
    proxy_buffering off;
}
location = /auth/v1/check {
    limit_except GET { deny all; }
    if ($no5_password_origin_ok = 0) { return 403; }
    proxy_pass http://127.0.0.1:8790/check;
    proxy_set_header X-No5-Gateway-Key $http_x_no5_gateway_key;
    proxy_set_header X-No5-Gateway-Password $http_x_no5_gateway_password;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
}
location ^~ /auth/ { return 404; }

# One-time V8 enrollment/revocation authenticate at the gateway with either
# bootstrap key or password. No bearer can provision a device key.
location ~ ^/v2/lumina/(enroll|revoke)$ {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    access_log off;
    proxy_pass http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-No5-Gateway-Key $http_x_no5_gateway_key;
    proxy_set_header X-No5-Gateway-Password $http_x_no5_gateway_password;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
}
